<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad)" />
  
  <!-- Graduation Cap / Teacher Emblem -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond -->
    <polygon points="256,130 420,200 256,270 92,200" fill="#ffffff" />
    <!-- Cap Base / Band -->
    <path d="M165,240 L165,310 C165,345 347,345 347,310 L347,240 Z" fill="#f0fdfa" opacity="0.95" />
    <!-- Tassel String & Ball -->
    <path d="M380,210 L380,315" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="380" cy="325" r="14" fill="#f59e0b" />
    
    <!-- Open Book at bottom -->
    <g transform="translate(136, 340)">
      <path d="M 120,40 C 90,20 30,20 0,35 L 0,85 C 30,70 90,70 120,90 C 150,70 210,70 240,85 L 240,35 C 210,20 150,20 120,40 Z" fill="#fef08a" />
      <path d="M 120,40 L 120,90" stroke="#047857" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
